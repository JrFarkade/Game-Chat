name: Build and Release GameChat APK

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/release-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          cp mobile/build/app/outputs/flutter-apk/app-release.apk dist/GameChat-v2.0.0.apk
          cp mobile/build/app/outputs/flutter-apk/app-release.apk dist/latest.apk

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GameChat-release-apk
          path: dist/GameChat-v2.0.0.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.0
          name: "GameChat v2.0.0 (Cloudflare Edge Edition)"
          body: |
            ## 🎮 GameChat v2.0.0 — Production Release
            - Cloudflare Workers & Durable Objects Edge Signaling
            - WebRTC real-time voice with Cloudflare Anycast STUN
            - 28 built-in synchronized soundboard meme clips
            - Android Foreground Service for background gaming (BGMI, COD, Free Fire)
            - 100% free serverless architecture (laptop not required)
          files: |
            dist/GameChat-v2.0.0.apk
            dist/latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Optional Upload to Cloudflare R2
        if: env.HAS_CF_CREDS == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HAS_CF_CREDS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          npm install -g wrangler
          wrangler r2 object put gamechat-releases/latest.apk --file=dist/latest.apk --content-type=application/vnd.android.package-archive || true
          wrangler r2 object put gamechat-releases/GameChat-v2.0.0.apk --file=dist/GameChat-v2.0.0.apk --content-type=application/vnd.android.package-archive || true
