<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameChat Edge Server</title>
  <style>
    body {
      background: #0e1117;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 60px 20px;
      margin: 0;
    }
    .card {
      max-width: 500px;
      margin: 0 auto;
      background: #161b26;
      border: 1px solid #2f384c;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    h1 { color: #7c4dff; margin-bottom: 8px; font-size: 1.8rem; }
    .status {
      display: inline-block;
      background: rgba(0, 230, 118, 0.15);
      color: #00e676;
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 20px;
      margin: 16px 0;
      border: 1px solid #00e676;
    }
    p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    .footer { margin-top: 24px; font-size: 0.8rem; color: #64748b; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎮 GameChat Edge Server</h1>
    <div class="status">🟢 ONLINE & READY</div>
    <p>Cloudflare Workers & Durable Objects Real-time Voice Chat Backend</p>
    <div class="footer">GameChat v2.0 • Edge WebRTC Signaling Active</div>
  </div>
</body>
</html>
